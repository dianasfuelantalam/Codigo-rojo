const info=[
{title:'Planificar antes de adquirir',old:['La adquisición es parte de la planificación tecnológica, no un trámite aislado.','Comité multidisciplinario, inventario, políticas de sustitución y prioridades VEN.','Una necesidad de compra debe justificarse por la misión, la disponibilidad, el riesgo y los recursos.'],now:['Utilizar datos de demanda y disponibilidad para sustentar la necesidad.','Considerar fin de soporte digital, repuestos, actualizaciones y evidencia de beneficio.','Distinguir la criticidad de la tecnología de la urgencia de sustituir una unidad.'],lead:'Gerencia + medicina',task:'Entrega las ocho cartas y los tres tableros VEN. Clasifiquen y acuerden comprar, reparar o aplazar cada solicitud. Registra el consenso en el centro de control.',source:'Cruz (2010), pp. 103–113. Política de Dispositivos Médicos (Colombia, 2024); ampliación técnica.'},
{title:'Seleccionar con evidencia',old:['Definir especificaciones, solicitar cotizaciones y comparar alternativas.','Pugh: + mejor, S semejante, − inferior frente a una referencia.','Método de los pesos: peso × calificación; los pesos suman 100 %. Las donaciones también se evalúan.'],now:['Requisitos sanitarios y críticos antes de la puntuación compensatoria.','Evaluación de tecnologías sanitarias: evidencia clínica, impacto económico y organizacional.','Cuando aplique: interoperabilidad, soporte de software, ciberseguridad y usabilidad.'],lead:'Ingeniería clínica + jurídico',task:'Interpreta al vendedor. Muestra las ofertas físicas, escucha preguntas y revela los datos uno a uno. Luego registren Pugh y los puntajes ponderados.',source:'Cruz (2010), pp. 104, 116–126; OMS, guías de donaciones (2024) y evaluación de dispositivos (2025).'},
{title:'El precio no es el costo real',old:['Compra, alquiler o donación según necesidad y viabilidad.','Costo del ciclo de vida y análisis financiero con valor actual neto (VAN).','Comparar opciones bajo el mismo horizonte y condiciones.'],now:['Añadir licencias, integraciones, soporte digital, parches y disposición cuando correspondan.','El VAN mide beneficios netos descontados; no es el saldo de caja.','Una opción financiera atractiva no puede compensar riesgos críticos.'],lead:'Finanzas',task:'El comité calcula compra y alquiler del ventilador B. Registra sus valores y elección; después revela un imprevisto y vuelve a comparar.',source:'Cruz (2010), pp. 113–116, 141–144; ampliación de costos digitales.'},
{title:'El contrato protege al hospital',old:['Definir partes, precio, pagos, responsabilidades, garantía y servicios.','Acordar tiempos de respuesta, calidad, limitaciones, terminación y aceptación.','El libro hace referencia a Incoterms 2000.'],now:['Incoterms 2020 para operaciones internacionales cuando se pacten.','Considerar soporte de software, gestión de vulnerabilidades, datos y continuidad del servicio.','Las guías internacionales orientan criterios técnicos; no son obligaciones universales colombianas.'],lead:'Jurídico + compras',task:'Entrega las ocho tiras físicas del contrato tetris. El comité separa aceptar de rechazar y justifica las cláusulas críticas.',source:'Cruz (2010), pp. 117–120, 127–132; ICC Incoterms 2020; FDA, guía de ciberseguridad (2026).'},
{title:'Recibir no significa aceptar',old:['Hoja de aceptación: entrega, desempaque, ensamblaje e instalación.','Pruebas de aceptación, dictamen final, entrenamiento y registro definitivo.','Verificar accesorios, manuales, garantías y seguridad aplicable.'],now:['Para equipos conectados: integración, configuración segura y versiones de software.','Trazabilidad, alertas sanitarias y documentación digital.','Ningún control crítico pendiente se compensa con puntaje ni urgencia.'],lead:'Enfermería + ingeniería clínica',task:'Entrega el acta defectuosa y las evidencias impresas. Pide detectar inconsistencias y decidir si liberan el ventilador.',source:'Cruz (2010), pp. 132–140, tablas 4.11 y 4.12; ampliación técnica según el dispositivo.'}

function validate1(){let m=s.m1;if(m.ven.some(x=>!x)||m.act.some(x=>!x))return notify('Completa las ocho clasificaciones y decisiones.');let v=m.ven.filter((x,i)=>x===eq[i][5]).length,a=m.act.filter((x,i)=>x===(m.event&&i===6?'Reparar':eq[i][6])).length;let within=sum1()<=budget1();if(!m.event){if(m.first===null)m.first=Math.round((v+a)/16*10)+(within?1:0);if(v===8&&a===8&&within){m.before=true;save();renderKeep();notify('Plan inicial validado. Activa el evento en pantalla.',true)}else{save();notify('Revisen la prioridad clínica, la viabilidad de reparar y el presupuesto. '+v+'/8 categorías y '+a+'/8 acciones coinciden con la referencia.')}return}if(s.scores[0]===null)record(0,(m.first??0)+(a===8&&within?3:0)+(m.conditional?1:0));if(v===8&&a===8&&within&&m.conditional)complete(0);else notify('El plan debe atender todas las necesidades críticas, respetar el nuevo presupuesto y documentar la contingencia. '+a+'/8 acciones coinciden con la referencia.')}
function event1(){if(!s.m1.before||s.m1.ven.some((x,i)=>x!==eq[i][5])||s.m1.act.some((x,i)=>x!==eq[i][6]))return notify('Valida nuevamente el plan inicial antes del evento.');beep(3);modal('⚠ Código Rojo · Recorte presupuestal',`<p>Una falla crítica en la planta eléctrica obliga a reasignar $52 millones a infraestructura.</p><div class="split"><div><div class="sub">Anterior</div><div class="bigstat">$240 M</div></div><div><div class="sub">Nuevo presupuesto</div><div class="bigstat red">$188 M</div></div></div><div class="callout warn"><b>Dato técnico nuevo</b><p>El proveedor confirma que puede realizar la reparación temporal de la autoclave por $45 M; solo podrá retornar al servicio después de demostrar ciclos conformes y controles satisfactorios. Si falla, se activa contingencia y no se usa.</p></div><p>Tienen un minuto para revisar el plan.</p>`,()=>{s.m1.event=true;save();renderKeep()},'Aplicar recorte',true)}
function m2(){let m=s.m2;return `<div class="offergrid">${['A','B','C'].map((x,i)=>`<div class="offer"><div class="vent-model">${ventilatorArt(i)}</div><span class="tag gray">OFERTA ${x}</span><h3>Ventilador ${x}</h3><div class="price">${money([100,92,70][i])}</div><p class="sub">${['Referencia','Alternativa','Precio reducido'][i]}</p></div>`).join('')}</div><p class="sub">Ilustraciones de tres modelos ficticios: el diseño exterior no permite deducir su calidad, autorización ni desempeño.</p>${interviewPanel()}${m.dossier?`<div class="panel" style="margin-top:14px"><div class="field" style="margin-top:12px"><label>¿Cuál oferta no acredita el requisito sanitario?</label>${select(m.exclude,['A','B','C','Ninguna'],`change('m2','exclude',this.value)`,'Proveedor excluido')}</div></div><div class="split"><div class="panel"><h3>Matriz de Pugh</h3><p class="sub">A = referencia. Compara B respecto a A.</p><table><thead><tr><th>Criterio</th><th>A</th><th>B</th></tr></thead><tbody>${pugh.map((r,i)=>`<tr><td>${r[0]}</td><td>S</td><td>${select(m.pugh[i],['+','S','−'],`change('m2','pugh',this.value,${i})`,'Pugh '+r[0])}</td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>Método de los pesos</h3><table><thead><tr><th>Criterio</th><th>Peso</th><th>A</th><th>B</th></tr></thead><tbody><tr><td>Precio</td><td>40%</td><td>3</td><td>5</td></tr><tr><td>Garantía</td><td>30%</td><td>3</td><td>5</td></tr><tr><td>Repuestos</td><td>30%</td><td>5</td><td>3</td></tr></tbody></table><div class="split" style="margin-top:12px"><div class="field"><label>Total A (0–5)</label><input inputmode="decimal" value="${esc(m.a)}" oninput="textField('m2','a',this.value)" aria-label="Total A"></div><div class="field"><label>Total B (0–5)</label><input inputmode="decimal" value="${esc(m.b)}" oninput="textField('m2','b',this.value)" aria-label="Total B"></div></div><div class="field" style="margin-top:12px"><label>Modelo seleccionado</label>${select(m.model,['A','B','C'],`change('m2','model',this.value)`,'Modelo seleccionado')}</div></div></div><div class="panel"><h3>Negociación y donación</h3><p>El proveedor B acepta garantizar repuestos por 10 años a cambio de un 3 % adicional: $94,76 M. Paquete completo instalado: $100 M.</p><div class="checkrow">${tick(m.support,`change('m2','support',this.checked)`,'Negociación de repuestos')}<label>El comité negocia y documenta el soporte requerido antes de seguir.</label></div><p style="margin-top:12px">Oferta adicional: ventilador usado gratuito, sin manuales ni soporte acreditado.</p>${select(m.donation,['Aceptar sin revisión','Rechazar o condicionar a evaluación'],`change('m2','donation',this.value)`,'Decisión donación')}</div><div class="actions"><button class="button" onclick="validate2()">Validar selección</button>${solutionButton(1)}</div>${statusMsg()}`:""}`}
function interviewPanel(){
 const m=s.m2, count=m.revealed.length;
 const table=(rows)=>`<div class="tablewrap"><table><thead><tr><th>Dato</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 if(m.dossier)return `<div class="panel" style="margin-top:14px"><div class="eyebrow">Fase 2 · Expediente completo</div><h2>Ficha técnica comparativa</h2><p class="sub">Descubriste ${count} de 6 datos mediante preguntas. El vendedor entrega las especificaciones completas para que puedas realizar las matrices. Consulta esta tabla durante todo el reto.</p><div class="penalty-meter"><span>Descuento por entrevista</span><b>−${supplierPenalty()} de 25 pts</b></div>${table(specs)}</div>`;
 const last=m.lastQuestion===null?null:interviewQuestions[m.lastQuestion];
 return `<div class="panel" style="margin-top:14px"><div class="eyebrow">Fase 1 · Interrogatorio</div><h2>Entrevista al vendedor virtual</h2><div class="vendor-talk"><div class="vendor-avatar">${sceneArt(1)}</div><div class="callout"><b>Vendedor:</b> «Los tres ventiladores tienen buenos antecedentes comerciales. Si quieren comparar condiciones concretas, necesitaré preguntas específicas. ¿Qué desean verificar?»</div></div><p>Selecciona preguntas precisas: algunas son pertinentes en general, pero no permiten verificar las condiciones de esta oferta. Descubre al menos 5 de los 6 datos, incluida la autorización sanitaria aplicable. Puedes investigar los seis. <b>Cada pregunta que no aporte evidencia verificable resta 1 punto de los 25 de esta misión (máximo 6 puntos).</b> No se penalizan las consultas precisas.</p><div class="row between"><b>${count}/6 especificaciones descubiertas</b><span class="tag">${m.asked.length} preguntas · ${supplierPenalty()} sin evidencia</span></div><div class="progress" style="background:#dce8ed"><div style="background:var(--teal);width:${count/6*100}%"></div></div><div class="penalty-meter"><span>Descuento acumulado en esta misión</span><b>−${supplierPenalty()} pts</b></div><div class="questiongrid">${interviewQuestions.map((q,i)=>`<button class="button outline question" ${m.asked.includes(i)?'disabled':''} onclick="askSupplier(${i})">${m.asked.includes(i)?'✓ ':''}${q[0]}</button>`).join('')}</div>${last?`<div class="callout ${last[1]?'ok':'warn'}" role="status"><b>Respuesta del vendedor</b>${last[1]?table([specs[last[1]]]):`<p>${last[2]}</p><b>−1 punto por información insuficiente.</b>`}</div>`:''}${count?`<h3 style="margin-top:16px">Datos que ya descubriste</h3>${table(specs.filter((_,i)=>i===0||m.revealed.includes(i)))}`:''}<div class="actions"><button class="button" ${!interviewReady()?'disabled':''} onclick="finishInterview()">${count===6?'Cerrar entrevista y abrir matrices':'Solicitar ficha completa y abrir matrices'} →</button>${solutionButton(1)}</div><p class="sub">La ficha completa ofrece una base común y no revela las respuestas de las matrices. El contador distingue preguntas realizadas de evidencias obtenidas.</p></div>`;
}
function askSupplier(i){const m=s.m2,q=interviewQuestions[i];if(m.dossier||!q||m.asked.includes(i))return;m.asked.push(i);m.lastQuestion=i;if(q[1]&&!m.revealed.includes(q[1]))m.revealed.push(q[1]);save();renderKeep()}
function supplierPenalty(){return s.m2.asked.filter(i=>interviewQuestions[i]&&interviewQuestions[i][1]===0).length}
function interviewReady(){return s.m2.revealed.length>=5&&s.m2.revealed.includes(5)}
function finishInterview(){const m=s.m2;if(!interviewReady()||m.dossier)return;modal('Cerrar entrevista','<p>El vendedor entregará las especificaciones completas. Podrás consultarlas durante toda la comparación. Las matrices aún deben ser resueltas por ti.</p>',()=>{m.dossier=true;save();renderKeep()},'Abrir ficha técnica')}
function validate2(){let m=s.m2;if(!m.dossier)return;if(!m.exclude||m.pugh.some(x=>!x)||m.a===''||m.b===''||!m.model||!m.donation)return notify('Completa los datos, matrices y decisión de donación.');let p=m.pugh.filter((x,i)=>x===pugh[i][1]).length;let a=near(m.a,3.6),b=near(m.b,4.4);let ok=m.exclude==='C'&&p===6&&a&&b&&m.model==='B'&&m.support&&m.donation.startsWith('Rechazar');record(1,(m.exclude==='C'?5:0)+p+(a?3:0)+(b?3:0)+(m.model==='B'?3:0)+(m.support?3:0)+(m.donation.startsWith('Rechazar')?2:0)-supplierPenalty());if(ok)complete(1);else notify('Revisa autorización sanitaria, signos Pugh, pesos y condiciones de soporte. No se puede aprobar una alternativa con requisitos críticos sin acreditar.')}
function financialNumbers(){let m=s.m3,init=m.event===1?115:100,maint=m.event===2?10:6;return {init,maint,buy:-init+(40-maint)*3.7908+20/1.6105,rent:10*3.7908,costBuy:init+5*maint,costRent:150}}
function financialCost(choice){let n=financialNumbers();return choice==='Comprar'?n.costBuy:choice==='Alquilar'?n.costRent:0}
function m3(){let m=s.m3,n=financialNumbers();return `<div class="panel"><div class="row between"><h2>Comparación a cinco años · ventilador B</h2><span class="tag">PRESUPUESTO $200 M</span></div><p class="sub">Este presupuesto es específico para el ventilador, independiente del plan preliminar de la misión 1. Valores en millones de COP. Alternativas técnica y clínicamente equivalentes para el ejercicio.</p>${m.event?`<div class="callout danger"><b>Imprevisto ${m.event}</b> · ${m.event===1?'El paquete de compra aumentó $15 M.':'El mantenimiento de compra aumentó $4 M anuales.'} Revisa el cálculo y la modalidad.</div>`:''}<div class="tablewrap"><table><thead><tr><th>Concepto</th><th>Compra</th><th>Alquiler</th></tr></thead><tbody><tr><td>Inversión inicial</td><td>${money(n.init)}</td><td>$0</td></tr><tr><td>Beneficio anual antes de costos</td><td>$40 M</td><td>$40 M</td></tr><tr><td>Mantenimiento anual</td><td>${money(n.maint)}</td><td>Incluido</td></tr><tr><td>Cuota anual de alquiler</td><td>$0</td><td>$30 M</td></tr><tr><td>Valor residual al año 5</td><td>$20 M</td><td>$0</td></tr><tr><td>Horizonte / tasa</td><td>5 años / 10 %</td><td>5 años / 10 %</td></tr></tbody></table></div>${financeTimeline(n)}<div class="callout"><b>Factores del ejercicio</b><p>VAN compra = − inversión + (beneficio − mantenimiento) × 3,7908 + valor residual / 1,6105.<br>VAN alquiler = (beneficio − cuota) × 3,7908.</p></div><div class="split"><div class="field"><label>VAN compra (M COP)</label><input inputmode="decimal" value="${esc(m.buy)}" oninput="textField('m3','buy',this.value)" aria-label="VAN compra"></div><div class="field"><label>VAN alquiler (M COP)</label><input inputmode="decimal" value="${esc(m.rent)}" oninput="textField('m3','rent',this.value)" aria-label="VAN alquiler"></div></div><div class="field" style="margin-top:12px"><label>Modalidad elegida</label>${select(m.choice,['Comprar','Alquilar'],`change('m3','choice',this.value)`,'Modalidad elegida')}</div><div class="actions"><button class="button" onclick="validate3()">${m.event?'Validar decisión final':'Validar análisis inicial'}</button>${!m.event?`<button class="button redbtn" ${!m.base?'disabled':''} onclick="event3()">⚠ Revelar imprevisto financiero</button>`:''}${solutionButton(2)}</div>${statusMsg()}</div><div class="panel"><h3>Presupuesto nominal</h3><p class="sub">El costo nominal no descuenta los beneficios ni incorpora el valor residual. Reserva = $200 M − costo nominal.</p><div class="split"><div class="metric"><div class="label">Costo nominal · compra</div><div class="value">${money(n.costBuy)}</div></div><div class="metric"><div class="label">Costo nominal · alquiler</div><div class="value">${money(n.costRent)}</div></div></div>${m.choice?`<div class="callout"><b>Reserva según modalidad registrada: ${money(200-financialCost(m.choice))}</b></div>`:''}</div>`}
function textField(obj,key,v){s[obj][key]=v;save();let el=$('feedbackMsg');if(el)el.textContent=''}
function validate3(){let m=s.m3,n=financialNumbers();if(!m.buy||!m.rent||!m.choice)return notify('Registra los dos VAN y la modalidad elegida.');let a=near(m.buy,n.buy),b=near(m.rent,n.rent),c=m.choice===(n.buy>n.rent?'Comprar':'Alquilar');if(!m.event){if(m.first===null)m.first=(a?4:0)+(b?4:0)+(c?2:0);if(a&&b&&c){m.base=true;m.initialChoice=m.choice;save();renderKeep();notify('Comparación inicial validada. Activa el evento financiero.',true)}else{save();notify('Revisa el descuento de flujos y el valor residual. No confundas VAN con costo nominal.')}return}record(2,(m.first??0)+(a?4:0)+(b?3:0)+(c?3:0));if(a&&b&&c)complete(2);else notify('Recalcula con los datos del imprevisto y compara las dos opciones.')}
function event3(){let base=financialNumbers();if(!s.m3.base||!near(s.m3.buy,base.buy)||!near(s.m3.rent,base.rent)||s.m3.choice!=='Comprar')return notify('Valida nuevamente el análisis inicial.');let n=Math.random()<.5?1:2;beep(2);modal('⚠ Imprevisto financiero',`<p>${n===1?'El proveedor informa que el paquete de compra aumenta $15 millones.':'El proveedor modifica el costo anual del mantenimiento: aumenta $4 millones.'}</p><p>El alquiler conserva las condiciones iniciales. Comparen nuevamente los VAN.</p>`,()=>{s.m3.event=n;s.m3.buy='';s.m3.rent='';s.m3.choice='';save();renderKeep()},'Aplicar evento',true)}
function m4(){return `<div class="panel"><div class="row between"><h2>Contrato tetris</h2><span class="tag">MODALIDAD: ${s.m3.choice.toUpperCase()}</span></div><p class="sub">Audita las cláusulas del contrato CR-2026-01. Decide si cada condición se acepta o requiere renegociación. Supuestos: ventilador crítico sin respaldo inmediato, repuestos negociados por 10 años, cobertura desde aceptación y presupuesto de soporte ya acordado. Si alquilas, aplica la cobertura de servicio pactada.</p>${clauses.map((_,i)=>`<div class="clause contract-paper"><div><span class="tag gray">CLÁUSULA ${String(i+1).padStart(2,'0')}</span><h3>${contractDetails[i][0]}</h3><p>${contractDetails[i][1]}</p></div><select aria-label="Cláusula ${i+1}" onchange="change('m4','answers',this.value,${i})">${opt('','— Elegir —',s.m4.answers[i])}${opt('Aceptar','Aceptar',s.m4.answers[i])}${opt('Rechazar','Renegociar',s.m4.answers[i])}</select></div>`).join('')}<div class="callout"><b>Reserva del ventilador: ${money(200-financialCost(s.m3.choice))}</b><p>El contrato conserva los costos acordados; no agrega cargos ficticios.</p></div><div class="actions"><button class="button" onclick="validate4()">Validar contrato</button>${solutionButton(3)}</div>${statusMsg()}</div>`}
function validate4(){let a=s.m4.answers;if(a.some(x=>!x))return notify('Faltan cláusulas por clasificar.');let n=a.filter((x,i)=>x===clauseAnswers[i]).length;record(3,n/8*15);if(n===8)complete(3);else notify(n+'/8 condiciones correctas. Revisa las responsabilidades, cobertura y continuidad del servicio.')}

['Guía de transporte','El transportista reporta un golpe visible en una esquina del embalaje. No adjunta registro de novedad.',['Registrar y evaluar daños antes de aceptar','Ignorar el golpe si el equipo enciende','Aceptar sin dejar constancia'],0],

['Manual de usuario','USER MANUAL. Solo en inglés; los usuarios requieren documentación comprensible en español.',['Aceptar sin revisión','Eliminar el manual','Solicitar documentación comprensible para usuarios'],2],

function m5(){let m=s.m5;return `<div class="panel"><div class="row between"><h2>Expediente digital de recepción</h2><span class="tag redtag">UCI BLOQUEADA</span></div><div class="callout"><b>Acta del proveedor · ventilador B · CR-B-026</b><p>Embalaje sin novedades; accesorios completos; manual adecuado; cobertura correcta; pruebas aprobadas; inventario y capacitación completados. Dictamen del proveedor: apto para uso.</p></div><p>Contrasta el acta con los seis documentos y elige la acción correctiva apropiada en cada caso.</p><div class="evidencegrid">${evidence.map((e,i)=>`<article class="panel evidence"><div class="evidence-art">${evidenceArt(i)}</div><span class="tag gray">EVIDENCIA ${String(i+1).padStart(2,'0')}</span><h3>${e[0]}</h3><p>${e[1]}</p><div class="field"><label>Acción del comité</label><select aria-label="Acción evidencia ${i+1}" onchange="setEvidence(${i},this.value)">${opt('','— Elegir —',m.answers[i])}${e[2].map((x,j)=>opt(String(j),x,m.answers[i])).join('')}</select></div></article>`).join('')}</div><div class="callout warn"><b>Presión de gerencia</b><p>El equipo enciende y la cama está fuera de servicio. ¿Autorizas su uso clínico inmediatamente?</p></div>${select(m.decision,['Liberar inmediatamente','Bloquear hasta corregir y verificar'],`change('m5','decision',this.value)`,'Decisión ante recepción')}<div class="actions"><button class="button" onclick="validate5()">Evaluar inspección</button>${solutionButton(4)}</div>${statusMsg()}</div>`}

function validate5(){let m=s.m5;if(m.answers.some(x=>!x)||!m.decision)return notify('Responde las seis evidencias y decide si liberas o bloqueas el equipo.');let safe=m.decision.startsWith('Bloquear');record(4,m.found.length*1.5+(safe?6:0));if(m.found.length!==6||!safe)return notify('El equipo permanece bloqueado. Identifiquen todos los hallazgos y las condiciones críticas.');complete(4)}
const fb=[
()=>`<h2>Solución de planeación</h2><p>La tecnología puede ser vital aunque su sustitución no sea inmediata. Se prioriza la necesidad concreta, no la novedad.</p><div class="tablewrap"><table><thead><tr><th>Equipo</th><th>VEN</th><th>Plan inicial</th><th>Plan ajustado</th><th class="num">Costo ajustado</th></tr></thead><tbody>${eq.map((e,i)=>`<tr><td>${e[0]}</td><td>${e[5]}${i===5?'*':''}</td><td>${e[6]}</td><td>${i===6?'<b>Reparar temporalmente</b>':e[6]}</td><td class="num">${money(i===6?45:e[6]==='Comprar'?e[2]:e[6]==='Reparar'?e[3]:0)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td></td><td><b>$203 M</b></td><td><b>Recorte a $188 M</b></td><td class="num"><b>$188 M</b></td></tr></tbody></table></div><p class="sub" style="margin-top:10px">* N corresponde a la actualización adicional del ecógrafo con IA. La incubadora sigue siendo vital, pero requiere un plan futuro de sustitución. La autoclave no vuelve al servicio hasta validar seguridad y desempeño de esterilización.</p><div class="callout"><b>2010 → 2026</b><p>Priorizar y sustituir siguen vigentes; se amplían los criterios de obsolescencia digital, soporte y beneficio clínico demostrado. El presupuesto de misión 1 es una estimación preliminar, no una compra ejecutada.</p></div>`,
()=>`<h2>Solución de selección de proveedores</h2><p>Durante la entrevista descubriste ${s.m2.revealed.length} de 6 datos técnicos mediante ${s.m2.asked.length} preguntas (${supplierPenalty()} sin evidencia verificable). La ficha completa garantiza una base común para la comparación.</p><div class="penalty-meter"><span>Penalización aplicada a la puntuación de proveedores</span><b>−${supplierPenalty()} pts</b></div><p>C se excluye por no acreditar el requisito sanitario del escenario; el precio no compensa ese incumplimiento.</p><div class="split"><div class="metric"><div class="label">Modelo A · pesos</div><div class="value">3,6 / 5</div></div><div class="metric"><div class="label">Modelo B · pesos</div><div class="value green">4,4 / 5</div></div></div><p style="margin-top:12px"><b>Pugh de B:</b> +, +, S, S, −, S. Balance +1. El modelo B gana bajo los criterios del ejercicio; negociar repuestos de 7 a 10 años mejora la continuidad. Precio de lista negociado $94,76 M; paquete instalado $100 M.</p><div class="callout"><b>2010 → 2026</b><p>Los métodos se conservan; se amplían criterios con ETS, soporte digital, interoperabilidad y ciberseguridad. La donación del caso debe rechazarse o condicionarse a evaluación. Las donaciones exigen la misma evaluación de pertinencia, calidad y sostenibilidad.</p></div>`,
()=>{let n=financialNumbers();return `<h2>Solución del análisis financiero</h2><div class="split"><div class="metric"><div class="label">VAN compra · inicial</div><div class="value">$41,31 M</div></div><div class="metric"><div class="label">VAN compra · ajustado</div><div class="value">$${fmt(n.buy)} M</div></div><div class="metric"><div class="label">VAN alquiler</div><div class="value green">$${fmt(n.rent)} M</div></div><div class="metric"><div class="label">Reserva final · alquiler</div><div class="value green">$50 M</div></div></div>${vanChart(n)}<p style="margin-top:12px">Inicialmente conviene comprar. Después de cualquiera de los dos imprevistos, el alquiler tiene mayor VAN bajo los supuestos. Su costo nominal es $150 M. El VAN no es el presupuesto ni equivale al dinero en caja. Un VAN negativo no implica automáticamente alquilar.</p><div class="callout"><b>2010 → 2026</b><p>Además de mantenimiento, repuestos e instalación, incorporar al costo total licencias, soporte, actualizaciones y costos de integración cuando apliquen.</p></div>`},
()=>`<h2>Auditoría contractual · dictamen</h2><p>Las condiciones se evalúan frente a los acuerdos y riesgos del hospital ficticio, no como prohibiciones legales universales.</p><div class="contract-feedback">${contractDetails.map((c,j)=>`<article class="contract-paper"><span class="tag gray">CLÁUSULA ${String(j+1).padStart(2,'0')}</span><h3>${c[0]}</h3><span class="audit-stamp ${c[2]==='Aceptar'?'approved':'revise'}">${c[2]==='Aceptar'?'✓ ACEPTAR':'↻ RENEGOCIAR'}</span><p>${c[1]}</p><p><b>Justificación:</b> ${c[3]}</p></article>`).join('')}</div><div class="callout"><b>2010 → 2026</b><p>El contrato mantiene las responsabilidades, cobertura y aceptación verificable e incorpora soporte de software, gestión de vulnerabilidades, continuidad y protección de datos. Una SBOM facilita identificar dependencias vulnerables, pero no sustituye los parches ni su gestión.</p></div>`,
()=>`<h2>Inspección completada · correcciones pendientes de confirmar</h2><p>La respuesta esperada es bloquear el uso inicial, documentar los seis incumplimientos y solicitar corrección.</p><div class="tablewrap"><table><thead><tr><th>Hallazgo</th><th>Acción correctiva</th></tr></thead><tbody><tr><td>Embalaje golpeado sin registro</td><td>Documentar y evaluar daños.</td></tr><tr><td>Accesorio requerido faltante</td><td>Completar y verificar entrega.</td></tr><tr><td>Manual no comprensible</td><td>Entregar documentación adecuada al usuario.</td></tr><tr><td>Cobertura comienza antes de lo pactado</td><td>Corregir según contrato.</td></tr><tr><td>Pruebas pendientes</td><td>Realizar y documentar resultados satisfactorios.</td></tr><tr><td>Inventario y capacitación pendientes</td><td>Registrar activo y capacitar usuarios y técnicos.</td></tr></tbody></table></div><div class="callout"><b>2010 → 2026</b><p>La hoja de aceptación sigue siendo fundamental. Añadir, cuando corresponda, integración, configuración segura, versiones del software y trazabilidad digital. La urgencia no sustituye una prueba crítica.</p></div><div class="panel"><h3>Confirmación ficticia del proveedor y del hospital</h3><p>Después de revisar las respuestas, se emite una constancia digital de correcciones. En esta simulación se documentan los defectos, se completan los accesorios y manuales, se corrige la cobertura, se realizan pruebas satisfactorias, se capacita al personal y se registra el activo.</p><div class="checkrow">${tick(s.m5.corrected,`confirmCorrections(this.checked)`,'Confirmar correcciones simuladas')}<label>Confirmo que, en el escenario simulado, se documentaron todas las correcciones y pruebas aplicables.</label></div><button class="button ${s.released?'outline':'redbtn'}" ${!s.m5.corrected||s.released?'disabled':''} onclick="releaseICU()">${s.released?'✓ Cama UCI operativa':'Autorizar puesta en marcha'}</button>${s.released?'<div class="callout ok"><b>¡Código verde!</b> Cama UCI recuperada en la simulación.</div>':''}</div>`];
function confirmCorrections(v){if(s.released)return;s.m5.corrected=v;save();renderKeep()}
function releaseICU(){if(!s.done.every(Boolean)||!s.m5.corrected)return;modal('Autorizar puesta en marcha','<p>Se han completado las etapas y confirmado las pruebas, capacitación y registro en el escenario ficticio. ¿Confirma la autorización simulada?</p>',()=>{s.released=true;save();renderKeep();beep(2)},'Autorizar')}
function feedback(i){return `<div class="panel"><div class="eyebrow">Informe de auditoría · ${s.scores[i]??0}/${maxScore[i]} puntos (primer intento)</div>${assistedMission(i)?'<div class="callout warn"><b>Retroalimentación guiada</b><p>Se reveló al menos una solución. Los puntos reflejan las respuestas previas a la ayuda; el plan mostrado es la referencia corregida.</p></div>':''}${fb[i]()}<div class="actions"><button class="button" ${i===4&&!s.released?'disabled':''} onclick="nextMission(${i})">${i===4?'Ir a auditoría final':'Desbloquear '+titles[i+1]} →</button>${i===4&&!s.released?'<button class="button outline" onclick="navigate(5)">Ir a auditoría sin liberar UCI</button>':''}<button class="button outline" onclick="navigate(-1)">Ver mapa</button></div><p class="footer">Los errores del primer intento se registran; las correcciones permiten avanzar sin recuperar automáticamente el puntaje.</p></div>`}
const questions=[['¿Qué significa VEN?',['Valor, energía y necesidad','Vital, esencial y no tan esencial','Verificación, evaluación y negociación'],1],['¿Por qué se evalúa una donación?',['Porque puede generar costos, riesgos y necesidades de soporte','Porque toda donación es ilegal','Porque siempre cuesta más que comprar'],0],['¿Qué compara el método de Pugh?',['El VAN de dos opciones','El inventario de equipos','Alternativas frente a un modelo de referencia'],2],['¿Un VAN negativo obliga a alquilar?',['Sí, siempre','No; deben compararse opciones viables y sus riesgos','Sí, si el equipo es nuevo'],1],['¿Se libera un equipo con pruebas críticas pendientes?',['No, se mantiene bloqueado hasta verificar seguridad','Sí, si enciende','Sí, si el hospital tiene urgencia'],0]];
function quizHTML(k){let locked=s[k+'Locked'],ans=s[k+'Answers'];return `<div class="panel quiz"><h3>${k==='pre'?'Evaluación diagnóstica (sin nota)':'Evaluación final · 10 puntos'}</h3><p class="sub">${k==='pre'?'Responde antes de la exposición. No se mostrarán las soluciones todavía.':'Responde para verificar lo aprendido.'}</p>${questions.map((q,i)=>`<div class="field quizitem"><label>${i+1}. ${q[0]}</label><select aria-label="Pregunta ${i+1}" ${locked?'disabled':''} onchange="s.${k}Answers[${i}]=this.value;save()">${opt('','— Elegir —',ans[i])}${q[1].map((x,j)=>opt(String(j),x,ans[i])).join('')}</select>${locked&&k==='post'?`<p class="sub">${ans[i]===String(q[2])?'✓ Correcta':'Respuesta esperada: '+q[1][q[2]]}</p>`:''}</div>`).join('')}${locked?'':`<button class="button" onclick="lockQuiz('${k}')">Guardar evaluación</button>`}</div>`}
function lockQuiz(k){if(s[k+'Answers'].some(x=>x==='')){modal('Evaluación incompleta','<p>Responde las cinco preguntas antes de continuar.</p>');return}if(k==='pre'&&!s.player.trim()){modal('Identificación','<p>Escribe primero tu nombre o código.</p>');return}let n=s[k+'Answers'].filter((x,i)=>x===String(questions[i][2])).length;s[k+'Locked']=true;s.audit[k]=String(n);if(k==='post')s.audit.cross=String(n*2);save();renderKeep()}
function audit(){let pre=Number(s.audit.pre),post=Number(s.audit.post);return `<div class="titlebar"><div><div class="eyebrow">Cierre de la operación · ${esc(s.player)}</div><h1>Auditoría final</h1><p>Resultado individual · simulación académica</p></div></div>${metrics()}<div class="panel dark"><h2>Puntaje ${score()}/100</h2><p>Misiones: 90 puntos. Evaluación final: 10 puntos. UCI: ${s.released?'operativa en la simulación':'bloqueada'}.</p></div><div class="panel"><h2>Resultados por misión</h2>${titles.map((t,i)=>`<div style="margin:12px 0"><div class="row between"><b>${t}${assistedMission(i)?' · Solución consultada':''}</b><span>${s.scores[i]??0}/${maxScore[i]}</span></div><div class="progress" style="background:#e0eaee"><div style="background:#087f83;width:${(s.scores[i]??0)/maxScore[i]*100}%"></div></div></div>`).join('')}</div>${roleAudit()}${quizHTML('post')}${s.postLocked?`<div class="panel"><h2>Aprendizaje</h2><div class="split"><div class="metric"><div class="label">Antes</div><div class="value">${pre}/5 (${pre*20}%)</div></div><div class="metric"><div class="label">Después</div><div class="value">${post}/5 (${post*20}%)</div></div></div><p>Variación: ${(post-pre)*20} puntos porcentuales.</p></div>`:''}<div class="panel"><h2>Entrega tu resultado</h2><p>Comparte el resumen o descarga el informe y envíalo por el chat de la clase. Incluye tu rol y tu dictamen para la discusión colectiva. No se envía automáticamente.</p><div class="actions"><button class="button" onclick="finish()" ${!s.postLocked||(s.done.every(Boolean)&&s.roleAnswer===null)?'disabled':''}>Finalizar operación</button><button class="button outline" onclick="copyResult()" ${!s.postLocked||(s.done.every(Boolean)&&s.roleAnswer===null)?'disabled':''}>Copiar resultado</button><button class="button outline" onclick="exportReport()" ${!s.postLocked||(s.done.every(Boolean)&&s.roleAnswer===null)?'disabled':''}>Descargar informe</button></div><textarea id="resultText" readonly style="width:100%;min-height:125px;margin-top:12px;font:inherit;padding:10px">${esc(summaryText())}</textarea><p id="copyStatus" class="sub" role="status"></p></div>`}
function summaryText(){return ['CÓDIGO ROJO · '+s.player,'Puntaje: '+score()+'/100','Misiones: '+s.done.filter(Boolean).length+'/5','UCI: '+(s.released?'Operativa (simulada)':'Bloqueada'),'Pretest: '+(s.preLocked?s.audit.pre+'/5':'Pendiente'),'Postest: '+(s.postLocked?s.audit.post+'/5':'Pendiente'),'Entrevista: '+s.m2.revealed.length+'/6 datos; '+s.m2.asked.length+' preguntas; '+supplierPenalty()+' punto(s) de descuento', 'Rol: '+(roles[s.role]||'Sin asignar'), 'Dictamen del rol: '+roleReport(),...titles.map((t,i)=>t+': '+(s.scores[i]??0)+'/'+maxScore[i]+(assistedMission(i)?' (solución consultada)':''))].join('\n')}
async function copyResult(){let el=$('resultText');try{await navigator.clipboard.writeText(el.value);$('copyStatus').textContent='Resultado copiado. Pégalo en el chat de clase.'}catch(e){el.select();$('copyStatus').textContent='Selecciona y copia el texto manualmente.'}}
function auditVal(key,v,max){if(v==='')s.audit[key]='';else s.audit[key]=String(Math.max(0,Math.min(max,Math.round(Number(v)||0))));save();renderKeep()}
function closePending(){if(!s.started)return;modal('Cerrar con pendientes','<p>Si termina el tiempo, puedes registrar la auditoría aunque queden misiones sin completar. La UCI no se liberará por omitir etapas.</p>',()=>{s.earlyAudit=true;if(s.running){updateClock();s.running=false}save();navigate(5)},'Ir a auditoría')}
function finish(){if(!s.postLocked)return;if(s.done.every(Boolean)&&s.roleAnswer===null){modal('Dictamen pendiente','<p>Completa el dictamen de tu rol en la auditoría antes de finalizar.</p>');return;}if(s.running){updateClock();s.running=false;save()}updateClock();modal('Operación finalizada',`<p>Puntaje: ${score()}/100. Cama UCI: ${s.released?'operativa en el juego':'bloqueada'}.</p><p>Copia o descarga tu resultado y compártelo con la moderadora.</p>`)}
function exportReport(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([summaryText()],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='Codigo_Rojo_'+s.player.replace(/[^a-zA-Z0-9_-]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){sidebar();let html;if(s.screen===-1)html=home();else if(s.screen===5)html=audit();else{let i=s.screen;html=missionHeader(i)+(s.phase===0?briefing(i):s.phase===1?[m1,m2,m3,m4,m5][i]():feedback(i))} $('main').innerHTML=html+'<div class="footer">Código Rojo · Basado en Cruz, A. M. (2010), capítulo 4, pp. 103–144 · Actualización académica 2026 · Referencias: <button class="button outline small" onclick="showSources()">Consultar fuentes</button> · Escenario ficticio, no es una guía clínica.</div>';updateClock()}
function showSources(){modal('Fuentes y alcance',`<p>Cruz, A. M. (2010). <i>Gestión tecnológica hospitalaria: un enfoque sistémico</i>. Cap. 4, pp. 103–144.</p><p>Material de trabajo: guía revisada de Código Rojo, guion de exposición, cartas de misión 1 y evento actualizado.</p><p>Referencias de actualización: <a href="https://www.who.int/publications/i/item/9789240093621" target="_blank" rel="noopener">OMS, donaciones (2024)</a>; <a href="https://www.who.int/publications/i/item/9789240110878" target="_blank" rel="noopener">OMS, ETS (2025)</a>; <a href="https://www.fda.gov/medical-devices/medical-device-cybersecurity" target="_blank" rel="noopener">FDA, ciberseguridad</a>; <a href="https://iccwbo.org/business-solutions/incoterms-rules/" target="_blank" rel="noopener">ICC, Incoterms</a>. En Colombia consultar la autorización aplicable en INVIMA y la normativa consolidada de habilitación. Referencias internacionales no equivalen automáticamente a obligaciones colombianas.</p><p>La aplicación usa las cifras ficticias del juego; no realiza una verificación jurídica en tiempo real.</p>`)}
// Prevent changing locked or completed challenges while allowing review of briefings.
const originalPhase=phase;phase=function(p){if(s.screen>=0&&s.screen<5){if(p===2&&!s.done[s.screen])return;if(p===1&&s.done[s.screen]){originalPhase(2);return}}originalPhase(p)};

const sceneMeta=[['Centro de planeación','Ocho solicitudes. Un presupuesto limitado.','Prioriza sin poner en riesgo la atención.',0],['Mercado biomédico','Tres ofertas. Una selección fundamentada.','Investiga, contrasta y negocia.',4],['Dirección financiera','Cinco años de decisiones.','Compara modalidades bajo el mismo horizonte.',3],['Departamento jurídico','Contrato pendiente de firma.','Audita condiciones antes de comprometer al hospital.',4],['Recepción e inspección','Un expediente, seis evidencias.','Inspecciona antes de liberar la UCI.',1]];

function sceneBanner(i){const d=sceneMeta[i];return `<section class="scene-v6"><div class="scene-graphic">${sceneArt(i)}</div><div class="scene-copy"><span class="scene-kicker">HOSPITAL CENTRAL · MISIÓN ${i+1}</span><h2>${d[0]}</h2><p>${d[1]} ${d[2]}</p></div><img class="scene-person" src="${ASSETS.roles[d[3]]}" alt="Profesional del comité"></section>`}
function planningStatus(){const n=s.m1.act.filter(Boolean).length;return `<div class="mission-progress"><div><b>Solicitudes evaluadas</b><small>Clasificación VEN y decisión registradas: ${s.m1.act.filter((x,i)=>x&&s.m1.ven[i]).length}/8</small></div><div class="progress-dots">${s.m1.act.map((x,i)=>`<span class="${x&&s.m1.ven[i]?'set':''}" title="Solicitud ${i+1}">${i+1}</span>`).join('')}</div></div>`}
function financeTimeline(n){return `<div class="finance-timeline"><h3>Flujos a cinco años · millones COP</h3><div class="timeline-scroll"><div class="timeline-grid"><div></div>${Array.from({length:6},(_,i)=>`<div class="year">Año ${i}</div>`).join('')}<b>Compra</b>${Array.from({length:6},(_,i)=>`<div class="flow-cell">${i===0?'−'+n.init:`40 − ${n.maint}${i===5?' + 20':''}`}</div>`).join('')}<b>Alquiler</b>${Array.from({length:6},(_,i)=>`<div class="flow-cell">${i===0?'0':'40 − 30'}</div>`).join('')}</div></div><small>El año 5 incluye el valor residual de compra. Descuenta los flujos al 10 %; aquí aún no se muestra el VAN.</small></div>`}

function chooseRole(i){if(s.started||i<0||i>=roles.length)return;s.role=i;s.roleAnswer=null;save();renderKeep()}
function rolePicker(){return `<div class="role-picker"><h3>Selecciona tu rol en el comité</h3><p class="sub">Usa el rol asignado por la moderadora. Todas las personas resuelven las cinco misiones; cada especialidad tiene además un dictamen individual sin puntos adicionales.</p><div class="role-choice-grid">${roles.map((r,i)=>`<button type="button" class="role-choice ${s.role===i?'selected':''}" aria-pressed="${s.role===i}" ${s.started?'disabled':''} onclick="chooseRole(${i})"><img src="${ASSETS.roles[i]}" alt=""><span><b>${r}</b><small>${roleData[i].duty}</small></span>${s.role===i?'<strong>✓</strong>':''}</button>`).join('')}</div></div>`}
function roleReport(){if(!roleData[s.role])return 'No asignado';let d=roleData[s.role];return s.roleAnswer===null?'Pendiente · '+d.defense:(s.roleAnswer===d.correct?'Fundamentado':'Requiere revisión')+' · '+d.opts[s.roleAnswer]+' · Para el cierre: '+d.defense}
function submitRole(i){if(!roleData[s.role]||s.roleAnswer!==null||!Number.isInteger(i)||i<0||i>2)return;s.roleAnswer=i;save();renderKeep()}
function roleCheckpoint(){let d=roleData[s.role];if(!d)return '';let answered=s.roleAnswer!==null;return `<section class="panel role-checkpoint"><div class="eyebrow">DICTAMEN DE TU ESPECIALIDAD · SIN PUNTOS ADICIONALES</div><div class="role-check-head"><img src="${ASSETS.roles[s.role]}" alt=""><div><h3>${roles[s.role]}</h3><p class="sub">${d.duty}</p></div></div><p><b>${d.q}</b></p><div class="role-options">${d.opts.map((o,i)=>`<button class="button outline ${answered&&s.roleAnswer===i?'role-chosen':''}" ${answered?'disabled':''} onclick="submitRole(${i})">${answered&&s.roleAnswer===i?'Tu dictamen · ':''}${o}</button>`).join('')}</div>${answered?`<div class="callout ${s.roleAnswer===d.correct?'ok':'warn'}"><b>${s.roleAnswer===d.correct?'Dictamen fundamentado':'Dictamen para revisar'}</b><p>${d.why}</p><p><b>Para la discusión con el comité:</b> ${d.defense}</p></div>`:'<p class="sub">Elige una sola vez. Tu dictamen quedará en el informe para la discusión final.</p>'}</section>`}
function activeRole(i){let d=roleData[s.role];if(!d)return '';return `<div class="role-strip"><b>Tu rol: ${roles[s.role]}</b><span>${d.duty} · ${d.mission===i?'Tu especialidad está activa en esta misión.':'Dictamen en misión '+(d.mission+1)+'.'}</span></div>${d.mission===i&&s.phase!==0?roleCheckpoint():''}`}
